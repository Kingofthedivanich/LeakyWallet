services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leakywallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leakywallet}
      POSTGRES_DB: ${POSTGRES_DB:-leakywallet}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leakywallet}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-leakywallet}:${POSTGRES_PASSWORD:-leakywallet}@postgres:5432/${POSTGRES_DB:-leakywallet}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "LeakyWallet.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-leakywallet}:${POSTGRES_PASSWORD:-leakywallet}@postgres:5432/${POSTGRES_DB:-leakywallet}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["arq", "LeakyWallet.workers.arq_app.WorkerSettings"]
    volumes:
      - ./src:/app/src
    healthcheck:
      # arq only refreshes its Redis health key every health_check_interval
      # (20s, see workers/arq_app.py) - start_period must clear that or the
      # first few checks fail for real and the container never leaves
      # "unhealthy" even though the worker is fine. `arq --check` also
      # reimports the whole app (aiogram, sqlalchemy...) each run, ~7s -
      # timeout needs headroom above that.
      test: ["CMD", "arq", "--check", "LeakyWallet.workers.arq_app.WorkerSettings"]
      interval: 25s
      timeout: 15s
      retries: 5
      start_period: 40s
    stop_grace_period: 30s

volumes:
  postgres_data:
